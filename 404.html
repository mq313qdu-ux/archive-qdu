<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | أرشيف الأثر النافع</title>
  <meta name="description" content="عذرًا، لم يتم العثور على الصفحة المطلوبة في أرشيف الأثر النافع.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      position: relative;
    }
    .error-watermark {
      position: absolute;
      font-size: clamp(6rem, 20vw, 16rem);
      font-weight: 900;
      color: rgba(255, 255, 255, 0.02);
      pointer-events: none;
      user-select: none;
    }
    .error-box {
      position: relative;
      z-index: 2;
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 50px 36px;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .error-logo {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      margin: 0 auto 20px;
      border: 1px solid var(--glass-border);
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-watermark">404</div>
    <div class="error-box">
      <img src="assets/logo.png" alt="شعار الأرشيف" class="error-logo">
      <h1 class="error-title">الصفحة غير موجودة</h1>
      <p class="error-desc">
        يبدو أن هذه الصفحة لم تعد ضمن طيّات الأرشيف، يمكنك دائمًا العودة واستكشاف بقية الذكريات.
      </p>
      <a href="index.html" class="btn-primary">
        <span>العودة إلى الأرشيف</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
    </div>
  </div>
</body>
</html>
